<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fruit Spin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --plum:#2A1233;      /* фон: спелая слива */
  --plum-2:#3E1D4B;
  --plum-3:#57306A;
  --cherry:#E3263E;    /* кнопка и выигрыш */
  --cherry-dark:#A3142A;
  --lemon:#FFD23F;     /* монеты */
  --leaf:#3BB273;      /* опыт и успех */
  --peel:#FFF4E0;      /* окно барабанов */
  --ink:#2A1233;
  --text:#FFF4E0;
  --muted:#C9AFD4;
  --gold:#FFD23F;       /* текст-акцент: суммы, выигрыш */
  --bad:#FF7A8A;
  --n:3;
  --cell:min(calc((min(100vw,480px) - 76px) / var(--n)), 112px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* тёмная тема: графит без фиолетового */
:root[data-theme="dark"]{--plum:#141217;--plum-2:#221F27;--plum-3:#34303B;--text:#F4F1F6;--muted:#A9A2B0}
/* светлая тема: кремовая, как мякоть фрукта */
:root[data-theme="light"]{color-scheme:light;--plum:#FBF4E8;--plum-2:#FFFFFF;--plum-3:#EFE3D2;--text:#2A1233;--muted:#6E5A74;--gold:#A86A00;--bad:#C8102E;--peel:#FFF8EC}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--plum);
  background-image:radial-gradient(circle at 50% -10%, var(--plum-3) 0, transparent 60%);
  color:var(--text);
  font-family:Rubik,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px 16px 0}

/* верхняя панель */
.top{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--plum-3);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.who{flex:1;min-width:0}
.who .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:3px}
.xp .bar{flex:1;height:6px;border-radius:3px;background:var(--plum-2);overflow:hidden}
.xp .fill{height:100%;background:var(--leaf);width:0;transition:width .4s}
.snd{width:40px;height:40px;border-radius:50%;background:var(--plum-2);font-size:18px;flex:none}
.balance{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--plum-2);border-radius:18px;padding:10px 16px;margin-bottom:14px}
.balance .lbl{color:var(--muted);font-size:14px}
.balance .num{font-family:Unbounded,Rubik,sans-serif;font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;color:var(--gold)}
.delta{position:absolute;right:16px;top:50%;font-weight:700;font-size:18px;pointer-events:none;animation:fly 1.1s ease-out forwards}
.delta.minus{color:var(--bad)}.delta.plus{color:var(--leaf)}
@keyframes fly{from{opacity:1;transform:translateY(-50%)}to{opacity:0;transform:translateY(-160%)}}
.paylink{display:block;margin:6px auto 0;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.ref-box{display:flex;gap:8px;margin:0 0 12px}
.ref-box input{flex:1;min-width:0;height:48px;border-radius:12px;border:2px solid var(--plum-3);background:var(--plum);color:var(--text);font:inherit;font-size:14px;padding:0 12px}
.ref-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 0}
.ref-stats div{background:var(--plum-3);border-radius:14px;padding:12px;text-align:center;font-size:13px;color:var(--muted)}
.ref-stats b{display:block;font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
.hint{text-align:center;font-size:13px;color:var(--muted);margin-top:12px}
.hint b{color:var(--gold)}
.coin{width:24px;height:24px;border-radius:50%;background:var(--lemon);box-shadow:inset 0 -3px 0 #E0A800;flex:none}

/* автомат */
h1{font-family:Unbounded,Rubik,sans-serif;font-weight:800;font-size:clamp(30px,9vw,42px);text-align:center;margin:18px 0 12px;letter-spacing:-.01em;line-height:1}
h1 .f{color:var(--gold)}
h1 .s{color:var(--cherry);display:inline-block;transform:rotate(-4deg)}
.machine{position:relative;background:var(--cherry);border-radius:28px;padding:12px;box-shadow:0 8px 0 var(--cherry-dark)}
.window{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;background:var(--cherry-dark);border-radius:18px;padding:6px;overflow:hidden}
.reel{height:calc(var(--cell)*3);min-width:0;overflow:hidden;background:var(--peel);border-radius:12px;position:relative}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:18%;z-index:2;pointer-events:none}
.reel::before{top:0;background:linear-gradient(var(--peel),transparent)}
.reel::after{bottom:0;background:linear-gradient(transparent,var(--peel))}
.strip{will-change:transform}
.cell{height:var(--cell);display:grid;place-items:center;font-size:calc(var(--cell)*.56);line-height:1}
.cell svg{width:calc(var(--cell)*.6);height:calc(var(--cell)*.6)}
.cell.hit{animation:pop .5s ease-in-out 3}
@keyframes pop{50%{transform:scale(1.18)}}
.lines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
.lines line{stroke:var(--lemon);stroke-width:5;stroke-linecap:round;opacity:.9}
.msg{min-height:28px;text-align:center;font-weight:700;margin:16px 0 4px;font-size:18px}
.msg.win{color:var(--gold)}
.msg .mult{display:inline-block;background:var(--leaf);color:var(--ink);border-radius:8px;padding:0 6px;margin-left:6px}

/* управление */
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.bet{display:flex;align-items:center;gap:4px;background:var(--plum-2);border-radius:16px;padding:4px}
.bet button{width:40px;height:40px;border-radius:12px;background:var(--plum-3);font-size:22px;font-weight:700}
.bet button:disabled{opacity:.35}
.bet .val{min-width:62px;text-align:center}
.bet .val b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.bet .val small{font-size:11px;color:var(--muted)}
.spin{flex:none;width:104px;height:104px;border-radius:50%;background:var(--lemon);color:var(--ink);font-family:Unbounded,Rubik,sans-serif;font-weight:800;font-size:16px;box-shadow:0 6px 0 #C79A00;transition:transform .08s,box-shadow .08s}
.spin:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 #C79A00}
.spin:disabled{filter:saturate(.4) brightness(.8)}
.mode{display:flex;gap:4px;background:var(--plum-2);border-radius:14px;padding:4px;margin:4px 0 14px}
.mode button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 6px;border-radius:10px;font-size:14px;color:var(--muted)}
.mode button.on{background:var(--plum-3);color:var(--text);font-weight:700}
.mode button:disabled{opacity:.6}
.mode svg{width:30px;height:18px;flex:none}
.mode svg polyline{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.lines polyline{fill:none;stroke:var(--lemon);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.lines polyline.bent{stroke:var(--leaf)}
.pay .x small{color:var(--leaf);font-size:13px;margin-left:8px}
.paybtn{background:var(--plum-2);border-radius:16px;padding:0 12px;height:48px;font-size:14px;color:var(--muted)}

/* нижнее меню */
nav{margin-top:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:18px 0 14px}
.who-btn{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;padding:0}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;height:48px;border-radius:12px;border:2px solid var(--plum-3);background:var(--plum);color:var(--text);font:inherit;font-size:16px;padding:0 12px}
.field input:focus,.field select:focus{outline:none;border-color:var(--lemon)}
.phone-row{display:flex;gap:8px}
.phone-row input{flex:1;min-width:0}
.small{flex:none;height:48px;padding:0 12px;border-radius:12px;background:var(--plum-3);font-size:14px}
.field select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.theme-pick{margin:0}
.theme-pick .sw{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex:none}
.top-btns{display:flex;gap:8px}
.pf-photo{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.pf-photo .avatar{width:76px;height:76px;font-size:28px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:0 0 8px}
.pack{width:100%;display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;border-radius:16px;background:var(--plum-3);text-align:left}
.pack .c{flex:1}
.pack .c b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.pack .c small{color:var(--leaf);font-weight:700}
.pack .st{background:var(--lemon);color:var(--ink);font-weight:700;border-radius:12px;padding:8px 12px;white-space:nowrap}
.pack:disabled,.pack.off{opacity:.45}
.agree{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:14px}
.agree input{width:22px;height:22px;accent-color:var(--leaf);flex:none}
nav button{background:var(--plum-2);border-radius:14px;padding:10px 2px;font-size:12px;position:relative}
nav .dot{right:10px}
.spin small{display:block;font-family:Rubik,sans-serif;font-size:11px;font-weight:700;margin-top:2px}
.wheel-wrap{position:relative;width:min(78vw,300px);aspect-ratio:1;margin:8px auto 18px}
.wheel{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.7,.2,1)}
.wheel text{font-family:Unbounded,Rubik,sans-serif;font-weight:800;font-size:13px}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--lemon);filter:drop-shadow(0 2px 0 #C79A00);z-index:2}
.hub{position:absolute;inset:40%;border-radius:50%;background:var(--lemon);box-shadow:inset 0 -4px 0 #C79A00;display:grid;place-items:center;font-size:22px}
.wheel-res{text-align:center;font-weight:700;min-height:24px;margin-bottom:12px;color:var(--gold)}
nav button .ico{display:block;font-size:22px;margin-bottom:2px}
nav .dot{position:absolute;top:8px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--cherry)}

/* шторки */
.sheet-bg{position:fixed;inset:0;background:rgba(20,6,26,.7);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:82%;overflow:auto;background:var(--plum-2);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));z-index:21;transform:translateY(100%);transition:transform .25s}
.sheet.open{transform:none}
.sheet h2{font-family:Unbounded,Rubik,sans-serif;font-size:20px;margin:0 0 4px}
.sheet p.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--plum-3);font-size:18px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.day{background:var(--plum-3);border-radius:12px;padding:10px 4px;text-align:center;font-size:12px;color:var(--muted)}
.day b{display:block;color:var(--text);font-size:15px;margin-top:2px}
.day.done{background:var(--leaf);color:var(--ink)}.day.done b{color:var(--ink)}
.day.today{outline:2px solid var(--lemon)}
.day.big{grid-column:span 2}
.cta{width:100%;height:52px;border-radius:16px;background:var(--lemon);color:var(--ink);font-weight:700;font-size:16px}
.cta:disabled{background:var(--plum-3);color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--plum-3)}
.row:last-child{border-bottom:0}
.row .ic{width:44px;height:44px;border-radius:12px;background:var(--plum-3);display:grid;place-items:center;font-size:22px;flex:none}
.row.locked .ic{filter:grayscale(1);opacity:.5}
.row .t{flex:1;min-width:0}
.row .t b{display:block}
.row .t small{color:var(--muted)}
.row .r{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.got .r{color:var(--leaf)}
.pay{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--plum-3)}
.pay .sy{font-size:28px;display:flex;gap:2px}
.pay .sy svg{width:28px;height:28px}
.pay .x{margin-left:auto;font-weight:700;color:var(--gold)}
.note{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.5}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:8px;border-radius:10px;background:var(--plum-3);font-size:14px}
.tabs button.on{background:var(--lemon);color:var(--ink);font-weight:700}

/* тосты */
.splash{position:fixed;inset:0;z-index:50;background:var(--plum);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .35s}
.splash.hide{opacity:0;pointer-events:none}
.splash-logo{width:132px;height:132px}
.splash-logo .spin-arc{animation:arc 1.1s linear infinite}
.splash-logo .cherries{transform-origin:286px 156px;animation:sway 1.6s ease-in-out infinite}
@keyframes arc{to{transform:rotate(360deg)}}
@keyframes sway{50%{transform:rotate(-5deg)}}
.splash .word{font-family:Unbounded,Rubik,sans-serif;font-weight:800;font-size:34px;line-height:1}
.splash .word .f{color:var(--gold)}.splash .word .s{color:var(--cherry);display:inline-block;transform:rotate(-4deg)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--leaf);color:var(--ink);font-weight:700;padding:10px 16px;border-radius:14px;z-index:30;transition:transform .3s;max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){.splash-logo .spin-arc,.splash-logo .cherries{animation:none}.cell.hit{animation:none}.sheet,.toast{transition:none}}
</style>
</head>
<body>
<div class="splash" id="splash" aria-hidden="true"><svg class="splash-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Fruit Spin"> <defs> <radialGradient id="lgbg" cx="50%" cy="30%" r="75%"> <stop offset="0" stop-color="#57306A"/><stop offset="1" stop-color="#2A1233"/> </radialGradient> <radialGradient id="lgch" cx="35%" cy="30%" r="75%"> <stop offset="0" stop-color="#FF6B7D"/><stop offset=".55" stop-color="#E3263E"/><stop offset="1" stop-color="#A3142A"/> </radialGradient> </defs> <rect width="512" height="512" rx="112" fill="url(#lgbg)"/> <g class="spin-arc" style="transform-origin:256px 268px"> <path d="M256 92a176 176 0 1 1 -152.4 88" fill="none" stroke="#FFD23F" stroke-width="26" stroke-linecap="round"/> <path d="M128 138L77 165L131 197Z" fill="#FFD23F" stroke="#FFD23F" stroke-width="12" stroke-linejoin="round"/> </g> <g class="cherries"> <path d="M206 318C214 250 240 196 286 156" fill="none" stroke="#6B4423" stroke-width="12" stroke-linecap="round"/> <path d="M318 296C312 240 302 196 286 156" fill="none" stroke="#6B4423" stroke-width="12" stroke-linecap="round"/> <path d="M286 156c18-34 58-48 92-38c-14 34-52 52-92 38z" fill="#3BB273"/> <path d="M290 154c26-10 52-20 80-32" stroke="#2A8C55" stroke-width="5" fill="none" stroke-linecap="round"/> <circle cx="206" cy="342" r="66" fill="url(#lgch)"/> <circle cx="322" cy="320" r="62" fill="url(#lgch)"/> <ellipse cx="184" cy="318" rx="16" ry="22" fill="#fff" opacity=".45" transform="rotate(-25 184 318)"/> <ellipse cx="302" cy="298" rx="14" ry="20" fill="#fff" opacity=".45" transform="rotate(-25 302 298)"/> </g> </svg><div class="word"><span class="f">Fruit</span> <span class="s">Spin</span></div></div>
<div class="app">
  <header class="top">
    <button class="who-btn" data-open="profile" aria-label="Профиль" data-i18n-aria="profile">
      <div class="avatar" id="avatar">?</div>
      <div class="who">
        <div class="name" id="name"></div>
        <div class="xp"><span id="lvl">Ур. 1</span><div class="bar"><div class="fill" id="xpfill"></div></div></div>
      </div>
    </button>
    <div class="top-btns"><button class="snd" id="snd" aria-label="Звук" data-i18n-aria="sound">🔊</button><button class="snd" data-open="settings" aria-label="Настройки" data-i18n-aria="settings">⚙️</button></div>
  </header>

  <h1><span class="f">Fruit</span> <span class="s">Spin</span></h1>

  <div class="balance" id="balance"><span class="coin"></span><span class="lbl" data-i18n="balance">Баланс</span><span class="num" id="coins">0</span></div>

  <div class="machine">
    <div class="window" id="window">
      <svg class="lines" id="lines"></svg>
    </div>
  </div>

  <div class="msg" id="msg" aria-live="polite" data-i18n="msg.start">Собери три одинаковых фрукта в один ряд</div>

  <div class="mode" role="radiogroup" aria-label="Количество барабанов" data-i18n-aria="reelsAria">
    <button role="radio" data-reels="3" data-i18n="reels3">3 барабана</button>
    <button role="radio" data-reels="4" data-i18n="reels4">4 барабана</button>
  </div>
  <div class="mode" role="radiogroup" aria-label="Выигрышные линии" data-i18n-aria="linesAria">
    <button role="radio" data-mode="1"><svg viewBox="0 0 30 18"><polyline points="3,9 27,9"/></svg><span data-i18n="mode1">Прямые</span></button>
    <button role="radio" data-mode="2"><svg viewBox="0 0 30 18"><polyline points="3,9 27,9"/><polyline points="3,15 15,3 27,15"/></svg><span data-i18n="mode2">Прямые + изгиб</span></button>
  </div>

  <div class="controls">
    <div class="bet">
      <button id="betDown" aria-label="Уменьшить ставку" data-i18n-aria="betDown">−</button>
      <div class="val"><b id="bet">10</b><small data-i18n="betLabel">ставка за спин</small></div>
      <button id="betUp" aria-label="Увеличить ставку" data-i18n-aria="betUp">+</button>
    </div>
    <button class="spin" id="spin">КРУТИТЬ</button>
  </div>
  <div class="hint" id="hint"></div>
  <button class="paylink" data-open="info" data-i18n="info.link">Таблица выплат</button>

  <nav>
    <button data-open="deposit"><span class="ico">⭐</span><span data-i18n="nav.deposit">Пополнить</span></button>
    <button data-open="wheel"><span class="ico">🎡</span><span data-i18n="nav.wheel">Колесо</span><span class="dot" id="wheelDot" hidden></span></button>
    <button data-open="daily"><span class="ico">🎁</span><span data-i18n="nav.daily">Бонус</span><span class="dot" id="dailyDot" hidden></span></button>
    <button data-open="awards"><span class="ico">🏆</span><span data-i18n="nav.awards">Награды</span></button>
    <button data-open="friends"><span class="ico">👥</span><span data-i18n="nav.friends">Друзья</span></button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg"></div>

<section class="sheet" id="sheet-daily" role="dialog" aria-label="Ежедневный бонус">
  <button class="close" data-close aria-label="Закрыть" data-i18n-aria="close">✕</button>
  <h2 data-i18n="daily.title">Ежедневный бонус</h2>
  <p class="sub" data-i18n="daily.sub"></p>
  <div class="days" id="days"></div>
  <button class="cta" id="claim">Забрать</button>
</section>

<section class="sheet" id="sheet-awards" role="dialog" aria-label="Награды">
  <button class="close" data-close aria-label="Закрыть" data-i18n-aria="close">✕</button>

  if (S.freeSpins > 0 || spinning || spinCost() <= S.coins || S.betIdx === 0) return;

  while (S.betIdx > 0 && spinCost() > S.coins) S.betIdx--;

function save(){
  clearTimeout(saveTimer);

    const v = JSON.stringify(S);
    if (cloud) cloud.setItem(KEY, v, () => {});
    try { localStorage.setItem(KEY, v); } catch(e){}

}
function load(cb){
  const apply = v => { try { if (v) S = Object.assign(S, JSON.parse(v)); } catch(e){} cb(); };

let actx;
function ac(){
  if (!S.sound) return null;
  try{
    if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }catch(e){ return null; }
  return actx;
}
function tone(f1, f2, dur, type, vol, delay=0){
  const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t);
  if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
let noiseBuf;
// короткий щелчок шума через полосовой фильтр
function click(freq, q, dur, vol, delay=0){
  const a = ac(); if (!a) return;
  if (!noiseBuf){
    noiseBuf = a.createBuffer(1, a.sampleRate*0.5, a.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }
  const t = a.currentTime + delay, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  src.connect(f).connect(g).connect(a.destination);
  src.start(t, Math.random()*0.4); src.stop(t+dur+0.01);
}

let reels = [], grid = [];
const newGrid = () => Array.from({length:S.reels}, ()=>[rnd(),rnd(),rnd()]);
function buildReels(){
  document.documentElement.style.setProperty('--n', S.reels);

}
function cellH(){ return reels[0].getBoundingClientRect().height/3; }
function paintStatic(){
  reels.forEach((r,c)=>{
    const st = r.firstElementChild;

    st.innerHTML = grid[c].map(s=>`<div class="cell">${symHTML(s)}</div>`).join('');
  });
}
function spinReel(c, finalCol, dur){
  return new Promise(res=>{
    const st = reels[c].firstElementChild, h = cellH();
    const filler = Array.from({length: 14 + c*4}, rnd);
    const seq = [...finalCol, ...filler, ...grid[c]];

    st.style.transition='none';
    st.style.transform=`translateY(${-(seq.length-3)*h}px)`;
    st.offsetHeight;
    st.style.transition=`transform ${dur}ms cubic-bezier(.15,.75,.3,1.04)`;

function evaluate(g, bet){

  let total = 0;

    const walk = path => {
      let ext = false;
      if (path.length < N) for (const d of moves){
        const r = path[path.length-1] + d;
        if (r>=0 && r<ROWS && g[path.length][r].id===sym.id){ ext = true; walk(path.concat(r)); }
      }
      if (!ext && path.length >= 3){
        const bent = path.some(x=>x!==path[0]);
        // линия с изгибом платит одинаково при любой длине, иначе режим уходит в плюс игроку
        total += lineBet*sym.pay*(bent ? BENT_K : lenMult(path.length))*modePay();
        hits.push({rows:path, bent, sym});
      }
    };
    walk([r0]);
  }
  return {total: Math.round(total), hits};
}
function drawLines(hits){
  const svg = $('lines'), box = svg.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
  // центр конкретной ячейки с фруктом, относительно окна барабанов
  const pt = (c, row) => {
    const b = reels[c].firstElementChild.children[row].getBoundingClientRect();
    return (b.left + b.width/2 - box.left).toFixed(1) + ',' + (b.top + b.height/2 - box.top).toFixed(1);
  };
  svg.innerHTML = hits.map(({rows,bent})=>
    `<polyline class="${bent?'bent':''}" points="${rows.map((row,c)=>pt(c,row)).join(' ')}"/>`).join('');
  hits.forEach(({rows})=>rows.forEach((row,c)=>reels[c].firstElementChild.children[row].classList.add('hit')));
}

/* ---------- вращение ---------- */
let spinning = false;
async function spin(){
  if (spinning) return;
  const free = S.freeSpins > 0;
  const bet = free ? FREE_BET : BETS[S.betIdx], cost = free ? 0 : spinCost();
  if (!free && S.coins < cost){ return outOfCoins(); }
  if (free) S.freeSpins--;
  spinning = true; $('spin').disabled = true; renderHUD();
  $('lines').innerHTML=''; $('msg').className='msg'; $('msg').textContent=t('msg.spinning');
  haptic('impactOccurred','medium'); sndPress(); startTicks();
  S.coins -= cost; S.spins++; renderCoins(); if (cost) delta(-cost);

  const next = newGrid();
  const base = reduced ? 250 : 1100, step = reduced ? 80 : (S.reels>3 ? 280 : 380);
  await Promise.all(next.map((col,c)=>spinReel(c, col, base + c*step)));
  stopTicks();
  grid = next; paintStatic();

  const {total, hits} = evaluate(grid, bet);
  let win = total, mult = 1;
  if (win>0){
    const r = Math.random(); let acc=0;
    for (const m of MULTS){ acc+=m.p; if (r<acc){ mult=m.x; break; } }
    win *= mult;
    S.wins++; S.streak++; S.maxStreak=Math.max(S.maxStreak,S.streak); S.best=Math.max(S.best,win);
    if (hits.some(h=>h.sym.id==='melon')) S.melons++;
    const jackpot = hits.some(h=>h.sym.id==='seven');
    if (jackpot) S.sevens = (S.sevens||0) + 1;
    S.coins += win; delta(win);
    drawLines(hits);
    $('msg').className='msg win';
    $('msg').innerHTML = (jackpot ? t('msg.jackpot') : '') + `+${coinsText(win)}` + (mult>1?`<span class="mult">×${mult}</span>`:'');
    haptic('notificationOccurred','success');
  } else {
    S.streak = 0;
    $('msg').textContent = t('msg.almost');
  }

  addXp(bet);
  checkAch();
  spinning=false; $('spin').disabled=false;
  renderHUD(); save(); submitScore();
}
function addXp(n){
  S.xp += n;
  while (S.xp >= xpNeed(S.level)){
    S.xp -= xpNeed(S.level); S.level++;
    const reward = 100*S.level; S.coins += reward;
    toast(t('toast.level',{n:S.level, coins:coinsText(reward)}) + (maxBetIdx(S.level)>maxBetIdx(S.level-1)? t('toast.levelBet',{bet:fmt(BETS[maxBetIdx(S.level)])}) :''));
    haptic('notificationOccurred','success');
  }
}
function checkAch(){
  for (const a of ACH){
    if (!S.ach[a.id] && a.ok(S)){
      S.ach[a.id]=1; S.coins+=a.r;
      setTimeout(()=>toast(`${a.ic} ${t('ach.'+a.id+'.t')}: +${coinsText(a.r)}`), 900);
    }
  }
}
function outOfCoins(){
  if (S.lastDaily !== today()){ $('msg').textContent=t('out.daily'); return openSheet('daily'); }
  if (S.coins < BETS[0] && Date.now()-S.lastRefill > 3600e3){
    S.lastRefill = Date.now(); S.coins += 200; renderHUD(); save();
    return toast(t('out.gift',{coins:coinsText(200)}));
  }
  if (S.coins >= BETS[0]){ $('msg').textContent = t('out.lower'); return; }
  const mins = Math.ceil((3600e3-(Date.now()-S.lastRefill))/60000);
  $('msg').textContent = t('out.wait',{m:mins});
}

// фото ужимается до 192×192 и хранится частями: в облаке Telegram одно значение до 4096 символов
const PHOTO_CHUNK = 4000;
function savePhoto(){
  try { localStorage.setItem(KEY+'_photo', photo); } catch(e){}
  if (!cloud) return;
  const parts = photo.match(new RegExp('.{1,'+PHOTO_CHUNK+'}','g')) || [];

function loadPhoto(cb){
  const local = () => { try { photo = localStorage.getItem(KEY+'_photo') || ''; } catch(e){} cb(); };

  });
}

/* ---------- колесо фортуны ---------- */
const FREE_BET = 50; // ставка бесплатного вращения слота
// w: вес (шанс), coins или spins: приз
const WHEEL = [
  {coins:100,  w:25, fill:'#57306A'},
  {spins:3,    w:15, fill:'#3BB273'},
  {coins:250,  w:20, fill:'#E3263E'},
  {coins:500,  w:13, fill:'#57306A'},
  {spins:5,    w:10, fill:'#3BB273'},
  {coins:1000, w:8,  fill:'#E3263E'},
  {spins:10,   w:5,  fill:'#3BB273'},
  {coins:2500, w:4,  fill:'#FFD23F'}
];
const SEG = 360 / WHEEL.length;
let wheelAngle = 0, wheelBusy = false;
const wLabel = p => p.coins ? fmt(p.coins) : `${p.spins} ${plural(p.spins, L().spinForms)}`;
function drawWheel(){
  const pt = (a, r) => `${(r*Math.sin(a*Math.PI/180)).toFixed(2)} ${(-r*Math.cos(a*Math.PI/180)).toFixed(2)}`;
  $('wheel').innerHTML = `<circle r="99" fill="#A3142A"/>` + WHEEL.map((p,i)=>{
    const a0 = i*SEG, a1 = a0+SEG, c = a0+SEG/2;
    const ink = p.fill==='#FFD23F' || p.fill==='#3BB273' ? '#2A1233' : '#FFF4E0';
    return `<path d="M0 0 L${pt(a0,92)} A92 92 0 0 1 ${pt(a1,92)} Z" fill="${p.fill}" stroke="#A3142A" stroke-width="2"/>
      <g transform="rotate(${c>180 ? c+90 : c-90})"><text x="${c>180 ? -58 : 58}" y="5" text-anchor="middle" fill="${ink}" ${p.spins?'font-size="10"':''}>${wLabel(p)}</text></g>`;
  }).join('');
  $('wheel').style.transition = 'none';
  $('wheel').style.transform = `rotate(${wheelAngle}deg)`;
}
function renderWheel(){
  drawWheel();
  const used = S.lastWheel === today();
  $('wheelBtn').disabled = used || wheelBusy;
  $('wheelBtn').textContent = used ? t('wheel.tomorrow') : t('wheel.btn');
  if (!wheelBusy) $('wheelRes').textContent = '';
}
$('wheelBtn').onclick = ()=>{
  if (wheelBusy || S.lastWheel === today()) return;
  let x = Math.random() * WHEEL.reduce((a,p)=>a+p.w,0), idx = 0;
  for (; idx<WHEEL.length; idx++) if ((x -= WHEEL[idx].w) < 0) break;
  const prize = WHEEL[idx];
  S.lastWheel = today(); save();              // отмечаем сразу, чтобы закрытие шторки не дало второе вращение
  wheelBusy = true; $('wheelBtn').disabled = true;
  sndPress(); haptic('impactOccurred','medium');
  const center = idx*SEG + SEG/2 + (Math.random()-.5)*SEG*.6;
  const turn = (360 - center - (wheelAngle % 360) + 720) % 360;
  const total = 360*6 + turn, dur = reduced ? 600 : 4200;
  const startAngle = wheelAngle; wheelAngle += total;
  const w = $('wheel');
  w.style.transition = `transform ${dur}ms cubic-bezier(.12,.7,.2,1)`;
  w.style.transform = `rotate(${wheelAngle}deg)`;
  // щелчок на каждом секторе: время по кривой замедления
  const segs = Math.floor(total / SEG);
  for (let k=1;k<=segs;k++){
    const t = 1 - Math.cbrt(1 - k/segs);
    setTimeout(sndTick, t*dur);
  }
  setTimeout(()=>{
    wheelBusy = false; renderWheel();
    if (prize.coins){ S.coins += prize.coins; delta(prize.coins); $('wheelRes').textContent = `+${coinsText(prize.coins)}`; }
    else { S.freeSpins += prize.spins; $('wheelRes').textContent = t('wheel.resFree',{n:prize.spins, bet:FREE_BET}); }
    haptic('notificationOccurred','success');
    tone(660, 990, .25, 'triangle', .25); tone(990, 1320, .3, 'triangle', .2, .12);
    renderHUD(); save();
  }, dur + 100);
};

$('betUp').onclick = ()=>{ if(S.betIdx<maxBetIdx(S.level)){S.betIdx++; haptic('selectionChanged'); renderHUD(); save();} };

/* ---------- старт ---------- */
const splashT0 = Date.now();
load(()=>{
  const hideSplash = () => setTimeout(()=>$('splash').classList.add('hide'), Math.max(0, 900 - (Date.now()-splashT0)));
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(hideSplash, hideSplash);
  if (!I18N[S.lang]) S.lang = detectLang();
  applyLang(); applyTheme();
  paintProfile();
  loadPhoto(paintProfile);
  if (![3,4].includes(S.reels)) S.reels = 3;
  buildReels();
  shownCoins = S.coins; $('snd').textContent = S.sound ? '🔊' : '🔇'; renderHUD();
  if (S.lastDaily !== today()) setTimeout(()=>openSheet('daily'), 400);
  claimReferrals();
});
// вернулся в игру из чата: проверить новых друзей
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) claimReferrals(); });
</script>
